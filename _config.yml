# Jekyll Configuration
exclude:
  - node_modules
  - frontend/node_modules
  - backend/node_modules
  - frontend
  - backend
  - .git
  - .gitignore
  - package.json
  - package-lock.json
  - README.md
  - SETUP.md
  - HOW_TO_REGISTER.md
  - COMPLETE_GUIDE.md

# Keep only essential files for the site
include:
  - index.html

# Build settings
theme: jekyll-theme-primer
